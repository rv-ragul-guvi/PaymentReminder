version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guvi_payment_reminder_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-GUVI Payment Reminder Service}
      - DATABASE_URL=sqlite+aiosqlite:////data/payment_reminders.db
      - EMAIL_MODE=${EMAIL_MODE:-SMTP}
      - COURSES_TEAM_EMAIL=${COURSES_TEAM_EMAIL:-courses-team@guvi.in}
      - SCHEDULER_INTERVAL_SECONDS=${SCHEDULER_INTERVAL_SECONDS:-300}
    volumes:
      - payment_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  payment_data:
